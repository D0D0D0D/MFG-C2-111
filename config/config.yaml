# Runtime configuration — MFG-C2-111 SupplierECNImpactBriefAgent
# Read at graph construction time (NOT the static AgentRegistry manifest; that is config/agent.yaml).
# Runtime-tunable params live here; static manifest keys live in agent.yaml.

max_retry: 3
timeout_s: 30

# LLM cost ceiling per invocation (Stage 4-5 impact assessment + brief compose).
# Template-user tunable initial value.
budget_usd: 1.50

# MANDATORY when hitl.enabled is true — checkpointer is required for interrupt() pause/resume
# (ADR-016 D5; setting hitl.enabled without this raises ConfigError at compile time).
memory_enabled: true

# HITL — D6 interrupt() pattern (approved: A-3).
# High-risk / low-confidence / data-quality-fail routes to SQE human review.
# When hitl_allowed is False (automated GraphNode pipeline), the node MUST NOT call interrupt();
# it returns a review-required brief instead (see docs/02_design.md Runtime Config design).
hitl:
  enabled: true
  max_hitl: 8   # safety valve — max interrupt/resume cycles per session (template-user tunable)

